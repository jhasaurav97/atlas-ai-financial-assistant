version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: atlas_postgres
    restart: always
    environment:
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: atlas_password
      POSTGRES_DB: atlas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: